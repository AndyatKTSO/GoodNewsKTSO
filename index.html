<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Service pausiert</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f7fa; color: #253247; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 540px; padding: 48px 38px; background: #fff; border: 1px solid #e5e9ef; border-radius: 18px; box-shadow: 0 12px 35px rgba(25, 44, 69, .05); text-align: center; }
    .symbol { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 22px; border-radius: 50%; background: #edf3fa; color: #46729b; font-size: 28px; }
    h1 { margin: 0 0 14px; font-size: clamp(26px, 5vw, 34px); font-weight: 650; letter-spacing: -.6px; }
    p { margin: 0; font-size: 17px; line-height: 1.7; color: #596579; }
    p + p { margin-top: 15px; }
    @media(max-width: 480px) { main { padding: 38px 25px; } }
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">Ⅱ</div>
    <h1>Service momentan pausiert</h1>
    <p>Dieser Service ist zurzeit pausiert.</p>
    <p>Bei Interesse könnt ihr euch gerne bei mir melden.</p>
  </main>
</body>
</html>
